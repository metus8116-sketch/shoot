<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<!-- 홈 화면에 추가 시 브라우저 크롬 없이 전체화면으로 실행 (촬영 필수) -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#EEF1F4">
<title>죽전 검색 인서트</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800;900&display=swap">
<style>
  /* ──────────────────────────────────────────────────────────────
     ②b 인서트 촬영용 폰 화면 프롭 — 배우가 실제로 조작한다.
     이 화면이 손을 비추는 키 라이트를 겸하므로 항상 라이트 톤 단일 테마.
     디자인 1px = var(--px). 기준 캔버스 900×1770 (실측 화면 비율 1.97).
     지도 요소의 '두께·크기'는 --px, '위치·펼침'은 % — 폰 비율이 달라도 안 뚱뚱해진다.
     ────────────────────────────────────────────────────────────── */
  :root {
    --px: min(0.1111vw, 0.0565vh);

    --ground:  #EEF1F4;   /* 폰 화면 실측 화이트(232,237,242)의 쿨 바이어스 계승 */
    --surface: #FFFFFF;
    --ink:     #0E1822;
    --muted:   #79879A;
    --hint:    #9AA6B3;
    --accent:  #2563EB;
    --accent-w:#EAF2FE;
    --line:    #E3E7EC;

    --key:     #FFFFFF;
    --key-fn:  #C3CCD6;
    --key-bed: #D9DEE5;
    --key-sh:  rgba(120,130,145,.5);

    --map-bg:  #E8ECEF;
    --map-blk: #DFE4E8;
    --map-grn: #D8E6D5;
    --map-wtr: #CFE0EA;
    --map-rd:  #FFFFFF;
    --map-rdm: #FBE9C6;
    --map-poi: #B9C3CC;
  }

  * { margin:0; padding:0; box-sizing:border-box; }

  html, body {
    height:100%; overflow:hidden;
    background:var(--ground);
    font-family:"Apple SD Gothic Neo", -apple-system, "Pretendard", "Noto Sans KR", sans-serif;
    color:var(--ink);
    -webkit-user-select:none; user-select:none;
    -webkit-tap-highlight-color:transparent;
    -webkit-touch-callout:none;
    overscroll-behavior:none; touch-action:manipulation;
  }

  #screen { position:fixed; inset:0; background:var(--ground); }

  /* ── 지도 ── */
  .map { position:absolute; inset:0; background:var(--map-bg); overflow:hidden; }
  .map i { position:absolute; display:block; }
  .park  { background:var(--map-grn); border-radius:calc(40*var(--px)); }
  .water { background:var(--map-wtr); }
  .road  { background:var(--map-rd); }
  .major { background:var(--map-rdm); }
  .blk   { background:var(--map-blk); border-radius:calc(6*var(--px)); }
  .poi   { width:calc(16*var(--px)); height:calc(16*var(--px)); border-radius:50%; background:var(--map-poi); }
  .me {
    width:calc(46*var(--px)); height:calc(46*var(--px)); border-radius:50%;
    background:var(--accent); border:calc(7*var(--px)) solid #fff;
    box-shadow:0 calc(3*var(--px)) calc(12*var(--px)) rgba(0,0,0,.28);
  }
  .me::after {
    content:""; position:absolute; left:calc(-38*var(--px)); top:calc(-38*var(--px));
    width:calc(110*var(--px)); height:calc(110*var(--px)); border-radius:50%;
    background:rgba(37,99,235,.16);
  }

  /* ── 상태바 (범용 시스템 표시 — 폰다움의 핵심 단서) ── */
  .sb { position:absolute; top:0; left:0; right:0; height:calc(110*var(--px)); z-index:5;
    display:flex; align-items:center; justify-content:space-between;
    padding:0 calc(52*var(--px)) 0 calc(58*var(--px)); }
  .sb .t { font-size:calc(46*var(--px)); font-weight:600; letter-spacing:-.01em;
    font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:calc(10*var(--px)); }
  .sb .ind { display:flex; align-items:center; gap:calc(14*var(--px)); }
  .sb svg { height:calc(30*var(--px)); width:auto; }

  /* ── 검색바 ── */
  .bar {
    position:absolute; top:calc(130*var(--px)); left:calc(34*var(--px)); right:calc(34*var(--px));
    height:calc(150*var(--px)); border-radius:calc(34*var(--px));
    background:var(--surface); display:flex; align-items:center;
    padding:0 calc(30*var(--px)) 0 calc(38*var(--px));
    box-shadow:0 calc(5*var(--px)) calc(20*var(--px)) rgba(20,40,70,.14); z-index:4;
  }
  .back {
    font-size:calc(74*var(--px)); color:#5B6B7E; font-weight:400; line-height:1;
    margin-right:calc(28*var(--px)); transform:scaleY(1.2);
    padding:calc(10*var(--px)) calc(16*var(--px)); margin-left:calc(-16*var(--px));
  }
  .q  { font-size:calc(76*var(--px)); font-weight:700; letter-spacing:-.01em; }
  .ph { font-size:calc(70*var(--px)); font-weight:500; color:var(--hint); }
  .cur {
    display:inline-block; width:calc(6*var(--px)); height:calc(80*var(--px));
    background:var(--accent); margin-left:calc(6*var(--px)); vertical-align:calc(-12*var(--px));
    animation:blink 1.06s steps(1,end) infinite;
  }
  @keyframes blink { 0%,50% {opacity:1} 51%,100% {opacity:0} }
  .clr { margin-left:auto; width:calc(62*var(--px)); height:calc(62*var(--px)); border-radius:50%;
    background:#B7C0CA; display:flex; align-items:center; justify-content:center; flex:0 0 calc(62*var(--px)); }
  .clr svg { width:calc(30*var(--px)); height:calc(30*var(--px)); }

  /* ── 제안줄 (돋보기 + 완성 질의) ── */
  .qs { position:absolute; top:calc(300*var(--px)); left:0; right:0; height:calc(126*var(--px));
    background:var(--surface); display:flex; align-items:center; gap:calc(26*var(--px));
    padding:0 calc(46*var(--px)); border-bottom:calc(2*var(--px)) solid var(--line); z-index:3; }
  .qs .ic { width:calc(64*var(--px)); height:calc(64*var(--px)); border-radius:50%; background:#EEF1F4;
    display:flex; align-items:center; justify-content:center; flex:0 0 calc(64*var(--px)); }
  .qs .ic svg { width:calc(38*var(--px)); height:calc(38*var(--px)); }
  .qs .txt { font-size:calc(52*var(--px)); font-weight:600; color:#2E3B4A; }

  /* ── 장소 카드 ── */
  .sug { position:absolute; top:calc(426*var(--px)); left:0; right:0; background:var(--surface);
    padding:calc(38*var(--px)) calc(46*var(--px)) calc(40*var(--px));
    display:flex; gap:calc(26*var(--px)); align-items:flex-start;
    border-bottom:calc(2*var(--px)) solid var(--line); z-index:3; transition:background .09s linear; }
  .sug.hi { background:var(--accent-w); }
  .pin { width:calc(82*var(--px)); height:calc(82*var(--px)); border-radius:50%; background:#EEF1F4;
    flex:0 0 calc(82*var(--px)); display:flex; align-items:center; justify-content:center; margin-top:calc(6*var(--px)); }
  .pin svg { width:calc(46*var(--px)); height:calc(46*var(--px)); }
  .col { min-width:0; }
  .nm { font-size:calc(78*var(--px)); font-weight:800; line-height:1.16; letter-spacing:-.025em; white-space:nowrap; }
  .nm b { color:var(--accent); font-weight:800; }
  .ad { font-size:calc(34*var(--px)); font-weight:500; color:var(--muted);
    margin-top:calc(14*var(--px)); white-space:nowrap; }
  .mt { font-size:calc(40*var(--px)); font-weight:600; color:var(--muted); margin-top:calc(14*var(--px));
    font-variant-numeric:tabular-nums; display:flex; align-items:center; gap:calc(16*var(--px)); }
  .chip { font-size:calc(32*var(--px)); font-weight:800; color:var(--accent); background:var(--accent-w);
    border-radius:calc(10*var(--px)); padding:calc(7*var(--px)) calc(16*var(--px)); }

  /* ── 키보드 ── */
  .kb {
    position:absolute; left:0; right:0; bottom:0; background:var(--key-bed);
    padding:calc(26*var(--px)) calc(10*var(--px)) calc(6*var(--px));
    padding-bottom:max(calc(6*var(--px)), env(safe-area-inset-bottom));
  }
  .row {
    display:flex; justify-content:center; gap:calc(10*var(--px));
    margin-bottom:calc(18*var(--px));
  }
  .key {
    background:var(--key); border-radius:calc(11*var(--px));
    box-shadow:0 calc(3*var(--px)) 0 var(--key-sh);
    width:calc(80*var(--px)); height:calc(96*var(--px));
    display:flex; align-items:center; justify-content:center;
    font-size:calc(42*var(--px)); font-weight:600; color:#2A3542;
    transition:background .05s linear, color .05s linear;
  }
  .key.fn { background:var(--key-fn); font-size:calc(34*var(--px)); width:calc(112*var(--px)); }
  .key.sp { width:calc(400*var(--px)); font-size:calc(34*var(--px)); color:#66727F; }
  .key.go { width:calc(186*var(--px)); background:var(--accent); color:#fff;
            font-size:calc(38*var(--px)); font-weight:700; }
  .key.down {
    background:var(--accent); color:#fff;
    box-shadow:0 calc(2*var(--px)) 0 rgba(30,64,120,.6);
    transform:translateY(calc(2*var(--px)));
  }
  .key.next { box-shadow:0 calc(3*var(--px)) 0 var(--key-sh), inset 0 0 0 calc(4*var(--px)) #F2A458; }

  /* ── 탭 임팩트 플래시 ── */
  #flash { position:fixed; inset:0; background:#fff; opacity:0; pointer-events:none; }
  #flash.go { animation:pop .18s ease-out; }
  @keyframes pop { 0% {opacity:.92} 100% {opacity:0} }

  @media (prefers-reduced-motion: reduce) {
    .cur { animation:none; }
    #flash.go { animation:none; }
  }
</style>
</head>
<body>
<div id="screen"></div>
<div id="flash"></div>

  const barHTML = (text, placeholder) =>
    `<div class="bar" data-act="bar"><span class="back" data-act="back">‹</span>` +
    (placeholder
      ? `<span class="ph">장소 검색</span>`
      : `<span class="q">${text}</span><span class="cur"></span>` + CLR) +
    `</div>`;

  const sugHTML = () => `<div class="sug" data-act="sug">
      <span class="pin"><svg viewBox="0 0 24 24" fill="#2563EB"><path d="M12 2C8.1 2 5 5.1 5 9c0 5.2 7 13 7 13s7-7.8 7-13c0-3.9-3.1-7-7-7zm0 9.5A2.5 2.5 0 1 1 12 6.5a2.5 2.5 0 0 1 0 5z"/></svg></span>
      <span class="col">
        <div class="nm"><b>죽전</b>에스S치과의원</div>
        <div class="ad">용인시 수지구 정든로 5 죽전역솔하임 2층</div>
        <div class="mt"><span class="chip">예약</span> 치과 · 리뷰 451</div>
      </span>
    </div>`;

  const keyHTML = (ch, cls = "") => {
    const nextCh = stage === "typing" && step < SEQ.length ? SEQ[step][0] : null;
    const isNext = HINT && ch === nextCh;
    return `<div class="key ${cls}${isNext ? " next" : ""}" data-key="${ch}">${ch}</div>`;
  };

  const kbHTML = () => `<div class="kb">
      <div class="row">${R1.map(c => keyHTML(c)).join("")}</div>
      <div class="row">${R2.map(c => keyHTML(c)).join("")}</div>
      <div class="row"><div class="key fn">⇧</div>${R3.map(c => keyHTML(c)).join("")}<div class="key fn">⌫</div></div>
      <div class="row"><div class="key fn">123</div><div class="key sp">스페이스</div><div class="key go">검색</div></div>
    </div>`;

  function render() {
    if (stage === "map") { screen.innerHTML = mapHTML() + SB + barHTML("", true); return; }
    const typed = step === 0 ? "" : SEQ[step - 1][1];
    screen.innerHTML =
      SB + barHTML(typed, false) + (step > 0 ? QS : "") +
      (stage === "suggest" || stage === "done" ? sugHTML() : "") +
      kbHTML();
    if (stage === "done") screen.querySelector(".sug").classList.add("hi");
  }

  function reset() { stage = "map"; step = 0; render(); }

  function onTap(e) {
    const t = e.target;
    if (!t || !t.closest) return;
    const keyEl = t.closest("[data-key]");
    const act   = (t.closest("[data-act]") || {}).dataset?.act;

    if (act === "back") { reset(); return; }

    // 지도 상태에서는 어디를 눌러도 검색으로 진입 (촬영 중 실패 방지)
    if (stage === "map") { stage = "typing"; step = 0; render(); return; }

    if (stage === "typing") {
      // 타점 관대 판정: 키보드 영역 안이면 어디를 눌러도 '다음 자모'로 입력.
      // A안에서 화면은 후반 UI로 전부 덮이므로, 프롭의 눌린 키 표시는 최종 화면에 남지 않는다 —
      // 프롭의 역할은 배우 가이드와 손 조명뿐. 테이크 실패 요인을 제거한다.
      if (!t.closest(".kb")) return;
      const expected = screen.querySelector(`[data-key="${SEQ[step][0]}"]`);
      if (expected) expected.classList.add("down");
      step++;
      setTimeout(() => {
        render();                                   // 눌린 키 해제 + 글자 반영
        if (step >= SEQ.length) {                   // 멈칫 뒤에 자동완성
          setTimeout(() => { stage = "suggest"; render(); }, 420);
        }
      }, 70);
      return;
    }

    if (stage === "suggest") {
      if (t.closest(".kb")) return;                 // 키보드 위 오탭만 무시
      stage = "done";
      render();
      flash.classList.remove("go");
      void flash.offsetWidth;
      flash.classList.add("go");
    }
  }

  // 포인터 이벤트가 오지 않는 래핑 환경(웹뷰·뷰어)까지 커버.
  // 시간 기반 디바운스는 쓰지 않는다 — 빠른 연타(실제 타이핑)를 막는다.
  let sawPointer = false, sawTouch = false;
  document.addEventListener("pointerdown", (e) => { sawPointer = true; onTap(e); }, true);
  document.addEventListener("touchstart",  (e) => { if (sawPointer) return; sawTouch = true; onTap(e); }, true);
  document.addEventListener("click",       (e) => { if (sawPointer || sawTouch) return; onTap(e); }, true);

  window.addEventListener("contextmenu", e => e.preventDefault());
  render();
})();
